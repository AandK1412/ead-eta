name: Refresh data & deploy

on:
  schedule:
    # Weekly, though USCIS publishes quarterly — the cost is one file fetch and
    # it means a new quarter appears within a week of release rather than
    # whenever someone remembers to push.
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Official USCIS sources only — no credentials, no secrets, and nothing
      # that depends on a third-party platform's terms. A fork builds a working
      # site with no configuration at all.
      - name: Build dataset
        run: python -m scraper.build

      - name: Show what was built
        run: |
          python - <<'PY'
          import json
          d = json.load(open("docs/data/official.json"))
          print(f"period={d['period']} generated={d['generated']}")
          for b in d["buckets"]:
              print(f"  {b['bucket']:22} published={b['published_months']} "
                    f"implied={b['implied_months']} pending={b['pending']:,}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
